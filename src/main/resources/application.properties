# ======================================
# TravelVista Spring Boot Configuration
# ======================================
# Sensitive values come from environment variables.
# Local dev uses defaults; Render uses env vars set in the dashboard.

# Server
server.port=${PORT:8081}
server.address=0.0.0.0

# PostgreSQL — use env vars for Render, defaults for local dev
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Render PostgreSQL needs SSL — only enable when DATABASE_URL is present
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT — no defaults for secrets in production
jwt.secret=${JWT_SECRET:TravelVistaSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong!!2024}
jwt.expiration=${JWT_EXPIRATION:28800000}

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Cloudinary Cloud Storage — from environment variables
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}

# Email (SMTP) — from environment variables
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
