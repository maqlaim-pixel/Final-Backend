# TravelVista Spring Boot Configuration
# Supply secrets through IntelliJ environment variables, a local .env file, or Render.

spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}


spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT secret is required from the environment/.env; never commit a real secret.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Cloudinary Cloud Storage (optional; configure through environment variables).
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}

# Customer authentication uses Resend HTTP API for email OTP.
# Twilio is intentionally not required for customer registration or login.
resend.api-key=${RESEND_API_KEY:}
#resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}
#resend.from-name=${RESEND_FROM_NAME:TravelVista}
#resend.from-email=otp@maqlaimtours.com
#resend.from-name=maqlaimtours
spring.sql.init.mode=never

resend.from-email=${RESEND_FROM_EMAIL}
resend.from-name=${RESEND_FROM_NAME:maqlaimtours}
